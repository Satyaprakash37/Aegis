server {
    listen 80;
    server_name local-proxy.internal localhost;

    # Emulate Cloudflare / CDN edge proxy headers
    add_header Server "cloudflare" always;
    add_header X-CDN-Edge "Simulated-Cloudflare-WAF" always;
    add_header CF-Ray "mock-aegis-edge-01" always;

    location / {
        proxy_pass http://vulnerable-target:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
